    </header>

    <div id="bgm-player" class="bgm-player">
        <button id="bgm-toggle" type="button" onclick="toggleBgm()">▶</button>
        <span id="bgm-time">0:00 / 0:00</span>
    </div>
    <!-- 배경음악 파일 자리: audio/파일명.mp3 를 넣으세요 -->
    <audio id="bgm" loop>
        <source src="audio/bgm.mp3" type="audio/mpeg">
    </audio>

    <nav>
        <a href="index.html" class="active">홈</a>
        <a href="info.html">소개</a>
        <a href="gallery.html">갤러리</a>
        <a href="contact.html">문의</a>
    </nav>

    <main>
        <section>
            <h2>환영합니다</h2>
            <p>공통 스타일 시트(style.css)를 여러 HTML 문서에서 함께 사용하는 예제 사이트입니다.</p>
        </section>

        <section>
            <h2>프로젝트 아이디어</h2>
            <p>이 사이트의 뼈대 위에 어떤 웹사이트를 만들 것인지 정리했습니다.</p>
            <a href="idea.html" class="button">아이디어</a>
        </section>

        <section>
            <h2>페이지 안내</h2>
            <ul>
                <li><a href="info.html">소개</a> - 사이트 소개와 페이지 구성표</li>
                <li><a href="gallery.html">갤러리</a> - 이미지와 비디오</li>
                <li><a href="contact.html">문의</a> - 문의 양식</li>
            </ul>
        </section>

        <section>
            <h2>외부 링크</h2>
            <ul>
                <li><a href="mailto:woohyeuk11@gmail.com">이메일 링크</a></li>

    <footer>
        <p>&copy; 2026 모바일 웹 실습</p>
    </footer>

    <script>
        var bgm = document.getElementById('bgm');
        var bgmToggle = document.getElementById('bgm-toggle');
        var bgmTime = document.getElementById('bgm-time');

        function formatTime(sec) {
            if (!isFinite(sec)) return '0:00';
            var m = Math.floor(sec / 60);
            var s = Math.floor(sec % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function toggleBgm() {
            if (bgm.paused) {
                bgm.play();
            } else {
                bgm.pause();
            }
        }

        bgm.addEventListener('play', function () {
            bgmToggle.textContent = '❚❚';
        });
        bgm.addEventListener('pause', function () {
            bgmToggle.textContent = '▶';
        });
        bgm.addEventListener('timeupdate', function () {
            bgmTime.textContent = formatTime(bgm.currentTime) + ' / ' + formatTime(bgm.duration);
        });
        bgm.addEventListener('loadedmetadata', function () {
            bgmTime.textContent = formatTime(bgm.currentTime) + ' / ' + formatTime(bgm.duration);
        });
    </script>
</body>
</html>
